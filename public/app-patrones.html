                type: 'Creacional',
                problem: 'Crear distintos tipos de cuentas (banco, tarjeta, cripto) requiere lógica diferente de base de datos (distintas tablas). Si esto se hace en el controlador de la API, se rompe el principio de Responsabilidad Única.',
                solution: 'Crear una clase "Fábrica" que evalúa el payload JSON y delega la creación en la base de datos a un "Creador" específico para cada tipo de cuenta.',
                code: `from abc import ABC, abstractmethod
from sqlalchemy.orm import Session

# 1. Interfaz del Creador
class AccountCreator(ABC):
    @abstractmethod
    def create_account(self, db: Session, data: dict, user_id: str): 
        pass

# 2. Creadores Concretos
class BankAccountCreator(AccountCreator):
    def create_account(self, db, data, user_id):
        acc = Cuenta(usuario_id=user_id, tipo="banco", saldo_actual=data.get('saldo', 0))
        db.add(acc)
        return acc

class CryptoAccountCreator(AccountCreator):
    def create_account(self, db, data, user_id):
        acc = Cuenta(usuario_id=user_id, tipo="cripto")
        db.add(acc)
        db.flush() # Obtener UUID generado
        
        crypto = CriptoConfig(cuenta_id=acc.id, simbolo=data['simbolo'], cantidad=data['cantidad'])
        db.add(crypto)
        return acc

# 3. La Fábrica
class AccountFactory:
    @staticmethod
    def get_creator(tipo: str) -> AccountCreator:
        creators = {
            "banco": BankAccountCreator(),
            "cripto": CryptoAccountCreator()
        }
        return creators[tipo]

# --- USO EN FASTAPI ---

# acc = creator.create_account(db_session, payload, current_user.id)`

                problem: 'El módulo de Patrimonio necesita sumar los saldos en USD de todas las cuentas. Sin embargo, una cuenta bancaria suma directamente, una tarjeta de crédito es deuda (resta), y cripto requiere multiplicar cantidad por precio de mercado.',

# 1. Interfaz de Estrategia
class BalanceStrategy(ABC):
    @abstractmethod
    def calc_usd(self, account) -> float: 
        pass

# 2. Estrategias Concretas
class StandardBalanceStrategy(BalanceStrategy):
    def calc_usd(self, account): 
        return float(account.saldo_actual) 

class CreditCardStrategy(BalanceStrategy):
    def calc_usd(self, account): 
        # La deuda de tarjeta resta al patrimonio neto
        return float(-account.saldo_actual) 

class CryptoBalanceStrategy(BalanceStrategy):
    def calc_usd(self, account):
        # Requiere cálculo usando relaciones de la base de datos
        return float(account.cripto_config.cantidad * account.cripto_config.precio_actual_usd)

# 3. Contexto
class BalanceContext:
    def __init__(self, strategy: BalanceStrategy):
        self._strategy = strategy

    def get_balance(self, account):
        return self._strategy.calc_usd(account)

# --- USO ---
# ctx = BalanceContext(CryptoBalanceStrategy())
# usd_balance = ctx.get_balance(my_crypto_account)`
            },

                name: 'Facade',

                problem: 'El frontend de React necesita una vista resumen con: liquidez total, tarjetas agrupadas por cupo, y portafolio cripto. Orquestar estas consultas múltiples desde el router es sucio y acoplado.',

                code: `class AccountDashboardFacade:
    def __init__(self, db_session):
        self.account_repo = AccountRepository(db_session)
        self.card_repo = CardRepository(db_session)
        self.crypto_repo = CryptoRepository(db_session)

    def get_full_summary(self, user_id: str) -> dict:
        # Orquestación interna compleja oculta al cliente
        liquidez = self.account_repo.get_liquid_accounts(user_id)
        tarjetas = self.card_repo.get_cards_with_groups(user_id)
        cripto = self.crypto_repo.get_portfolio(user_id)
        
        # Interfaz simplificada y unificada
        return {
            "liquidez": {
                "total": sum(a.saldo_actual for a in liquidez), 
                "items": liquidez
            },
            "tarjetas": tarjetas,
            "cripto": cripto
        }

            },
            {
                id: 'adapter',
                name: 'Adapter',
                type: 'Estructural',
                problem: 'El background worker de Celery actualiza precios usando la API de CoinGecko. Si mañana cambia a Binance API, el código entero se rompería por las diferentes llaves JSON.',
                solution: 'Un Adaptador convierte la interfaz y respuesta específica de una API externa a una interfaz genérica que el sistema Sotang espera.',
                code: `from abc import ABC, abstractmethod
import httpx

# 1. Interfaz Objetivo (Lo que Sotang necesita)
class CryptoProvider(ABC):
    @abstractmethod
    def get_usd_price(self, symbol: str) -> float: 
        pass

# 2. Adaptador para CoinGecko
class CoinGeckoAdapter(CryptoProvider):
    def __init__(self):
        self.client = httpx.Client()
        
    def get_usd_price(self, symbol: str) -> float:
        url = f"https://api.coingecko.com/v3/simple/price?ids={symbol.lower()}&vs_currencies=usd"
        res = self.client.get(url).json()
        
        # CoinGecko devuelve {"bitcoin": {"usd": 65000}}
        # El adaptador lo traduce a un simple float
        return float(res.get(symbol.lower(), {}).get('usd', 0.0))

# --- USO EN CELERY WORKER ---
# provider = CoinGeckoAdapter()
# new_price = provider.get_usd_price("bitcoin")
# crypto_account.precio_actual_usd = new_price`

                code: `# 1. Gestor de Eventos (Event Bus)
class EventManager:
    def __init__(self): 
        self._listeners = {}

    def subscribe(self, event, listener):
        self._listeners.setdefault(event, []).append(listener)

    def notify(self, event, data):
        for listener in self._listeners.get(event, []):
            listener.update(data)

event_manager = EventManager()

# 2. Observadores (En módulos independientes)
class AccountUpdater:
    def update(self, txn_data):
        print(f"[Accounts] Actualizando saldo de cuenta {txn_data['cuenta_id']}")

class GoalUpdater:
    def update(self, txn_data):
        print(f"[Goals] Recalculando meta asociada a cuenta {txn_data['cuenta_id']}")

# 3. Configuración y Emisión
# Al arrancar la app:
event_manager.subscribe("NEW_TXN", AccountUpdater())
event_manager.subscribe("NEW_TXN", GoalUpdater())

# En transactions/service.py:
def create_transaction(db, txn_data):
    # db.add(Transaccion(...))
    event_manager.notify("NEW_TXN", txn_data)`

            Solution: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>

                                <div>

                        </div>
                        <div className="px-6 pb-2">

                        </div>
                    </main>

            );
        };
